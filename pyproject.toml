[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-v5"
version = "0.1.0"
description = "Atlas V5 model-led local agent environment"
requires-python = ">=3.14"
dependencies = [
  "alembic>=1.16",
  "croniter>=6.0",
  "fastapi>=0.116",
  "jsonschema>=4.25",
  "openai>=1.100",
  "pgvector>=0.4",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.10",
  "python-multipart>=0.0.20",
  "sqlalchemy>=2.0.43",
  "uvicorn[standard]>=0.35",
  "webauthn>=3.0.0",
]

[project.optional-dependencies]
dev = ["httpx>=0.28", "pytest>=8.4", "pytest-asyncio>=1.1", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
asyncio_mode = "auto"
