name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint backend
        run: uv run ruff check backend tests migrations

      - name: Validate deployment scripts
        run: bash -n deployment/*.sh

      - name: Migrate clean PostgreSQL database
        run: uv run alembic upgrade head
      - name: Run backend tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Build frontend
        run: npm run build
