name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: atlas_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ATLAS_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/atlas_ci
      ATLAS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/atlas_ci
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pinned Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Install matching PostgreSQL backup clients
        run: |
          sudo install -d -m 0755 /etc/apt/keyrings
          curl --fail --silent --show-error https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /tmp/atlas-postgresql.asc
          sudo install -m 0644 /tmp/atlas-postgresql.asc /etc/apt/keyrings/atlas-postgresql.asc
          pgdg_suite="$(lsb_release -cs)-pgdg"
          printf 'deb [signed-by=/etc/apt/keyrings/atlas-postgresql.asc] https://apt.postgresql.org/pub/repos/apt %s main\n' "${pgdg_suite}" | sudo tee /etc/apt/sources.list.d/atlas-pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo '/usr/lib/postgresql/17/bin' >> "$GITHUB_PATH"

      - name: Install uv
        run: python -m pip install uv==0.12.5

      - name: Install locked backend dependencies
        run: uv sync --locked --extra dev

      - name: Lint backend
        run: uv run ruff check backend tests migrations

      - name: Validate deployment scripts
        run: bash -n deployment/*.sh

      - name: Provision PostgreSQL extensions
        run: PGPASSWORD=postgres psql -h 127.0.0.1 -U postgres -d atlas_ci -c 'CREATE EXTENSION IF NOT EXISTS vector;'

      - name: Migrate clean PostgreSQL database
        run: uv run alembic upgrade head
      - name: Run backend tests
        run: uv run pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Test frontend conversation transport
        run: npm run test

      - name: Build frontend
        run: npm run build
